          root = Path("source/Engine").resolve()
          sys.path.insert(0, str(root / "misc/uwp"))
          from package_templates import jingu_release_version, jingu_version
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write("JINGU_VERSION=" + jingu_release_version(root) + "\n")
              env.write("JINGU_COMPATIBILITY=" + jingu_version(root) + "\n")
      - name: Compile Jingu Editor - Linux ARM64
        shell: bash
        run: |
          set -euo pipefail
          cd source/Engine
          scons \
            platform=linuxbsd \
            target=editor \
            arch=arm64 \
            production=yes \
            lto=full \
            debug_symbols=no \
            tests=no \
            dev_build=no \
            accesskit=no \
            -j4 2>&1 | tee ../../build-linux-arm64.log

      - name: Upload Linux ARM64 build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JinguEngine-${{ env.JINGU_VERSION }}-Linux-arm64-build-log
          path: build-linux-arm64.log
          if-no-files-found: warn
          retention-days: 14

      - name: Package Linux ARM64 editor
        shell: bash
        run: |
          set -euo pipefail
          OUT="dist/JinguEngine-${{ env.JINGU_VERSION }}-Linux-arm64"
          mkdir -p "$OUT"
          BIN="$(find source/Engine/bin -maxdepth 1 -type f -name '*.linuxbsd.editor.arm64*' | head -n 1)"
          test -n "$BIN"
          cp "$BIN" "$OUT/JinguEngine"
          chmod +x "$OUT/JinguEngine"
          cp source/Engine/LICENSE.txt "$OUT/LICENSE.txt"
          cp source/Engine/JINGU_LICENSE.txt "$OUT/JINGU_LICENSE.txt"
          cp source/Engine/COPYRIGHT.txt "$OUT/COPYRIGHT.txt"
          cp source/Engine/JINGU_NOTICE.txt "$OUT/JINGU_NOTICE.txt"
          cp source/Engine/JINGU_README.md "$OUT/README.md"
          {
            echo "Jingu Engine ${{ env.JINGU_VERSION }}"
            echo "Target: editor"
            echo "Platform: Linux"
            echo "Architecture: ARM64"
            echo "Build OS: Ubuntu 22.04 ARM64"
            echo "LTO: full"
            echo "Source ZIP: ${SOURCE_ZIP}"
            echo "Source SHA-256: ${SOURCE_SHA256}"
            echo "Workflow commit: $GITHUB_SHA"
            echo "Runtime validation: not physically tested by maintainer for this release."
          } > "$OUT/BUILD_INFO.txt"
          (cd "$OUT" && sha256sum JinguEngine BUILD_INFO.txt COPYRIGHT.txt JINGU_LICENSE.txt JINGU_NOTICE.txt LICENSE.txt README.md > SHA256SUMS.txt)

      - name: Upload Linux ARM64 editor
        uses: actions/upload-artifact@v4
        with:
          name: JinguEngine-${{ env.JINGU_VERSION }}-Linux-arm64
          path: dist/JinguEngine-${{ env.JINGU_VERSION }}-Linux-arm64/
          if-no-files-found: error
          retention-days: 14
